name: Validate Docker deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start and wait for health check
        run: docker compose up -d --wait --wait-timeout 90
      - name: Verify site and static files over HTTP
        run: |
          docker compose exec -T web nginx -t
          docker compose exec -T web wget -qO- http://127.0.0.1/ | grep -q 'CynoTrust Formation'
          for path in app.js data.js style.css assets/20_0.png assets/23_0.png assets/27_0.png assets/41_1.png assets/44_0.png assets/49_0.png; do
            docker compose exec -T web wget -qO /dev/null "http://127.0.0.1/$path"
          done
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
