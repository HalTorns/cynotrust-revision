name: Validate Docker deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SITE_PASSWORD: integration-test-password-only
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start and wait for health check
        run: docker compose up -d --wait --wait-timeout 90
      - name: Verify password protection and site over HTTP
        run: |
          docker compose exec -T web node --input-type=module < tests/http.mjs
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down
